services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unireserve}
      POSTGRES_USER: ${POSTGRES_USER:-unireserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unireserve}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run once, in filename order, on first start of an empty volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/02_procedures.sql:ro
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/03_triggers.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unireserve} -d ${POSTGRES_DB:-unireserve}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-unireserve}:${POSTGRES_PASSWORD:-unireserve}@db:5432/${POSTGRES_DB:-unireserve}
      # Key paths relative to /app (WORKDIR inside container)
      JWT_PRIVATE_KEY_PATH: ./keys/private.pem
      JWT_PUBLIC_KEY_PATH: ./keys/public.pem
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Persist RSA keys across container restarts so tokens remain valid.
      - api_keys:/app/keys

  # Enable once frontend/ has Dockerfile.
  # web:
  #   build: ./frontend
  #   depends_on: [api]
  #   ports: ["5173:5173"]

volumes:
  pgdata:
  api_keys:
